name: Lead OS CI
on:
  push:
    branches: [main, "feat/revenue-loop-e2e-20261024"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -vv --tb=short --junitxml=pytest-report.xml
      - name: Compile
        if: always()
        run: python -m compileall -q lead_os tests
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-os-pytest-results
          path: pytest-report.xml
          if-no-files-found: warn
